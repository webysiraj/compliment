const banks = {};


function getBank(category){

    if(!banks[category]){
        banks[category] =
            buildBank(category);
    }

    return banks[category];
}


/* =========================================================
   GET NEW COMPLIMENT
========================================================= */

function getNewCompliment(category){

    const bank =
        getBank(category);

    const used =
        getUsed();

    if(!used[category]){
        used[category] = [];
    }

    /*
       Agar 200 mein se kuch remaining hain,
       sirf unused compliments mein se choose hoga.
    */

    let available = [];

    for(let i=0;i<bank.length;i++){

        if(!used[category].includes(i)){
            available.push(i);
        }
    }


    /*
       200 complete ho gaye?
       Tabhi cycle reset.
    */

    if(available.length === 0){

        used[category] = [];

        available =
            Array.from(
                {length:200},
                (_,i)=>i
            );
    }


    const randomIndex =
        available[
            Math.floor(
                Math.random()*available.length
            )
        ];


    used[category].push(
        randomIndex
    );

    saveUsed(used);


    return {
        text:bank[randomIndex],
        number:randomIndex+1,
        remaining:200-used[category].length
    };
}

    button.disabled =

    button.textContent =
        "SENDING... 💌";


    /*
       FULL DATA SENT TO FORMSPREE

       Dashboard mein:

       category
       compliment_number
       generated_compliment
       zahra_reply
       remaining_compliments
       source

       sab visible hoga.
    */

    const used =
        getUsed();

    const remaining =
        200 -
        (
            used[currentCategory]
            ? used[currentCategory].length
            : 0
        );


    const formData =
        new FormData();


    formData.append(
        "category",
        categoryNames[currentCategory]
    );


    formData.append(
        "compliment_number",
        `${currentNumber} / 200`
    );


    formData.append(
        "generated_compliment",
        currentCompliment
    );


    formData.append(
        "zahra_reply",
        reply
    );


    formData.append(
        "remaining_compliments",
        remaining
    );


    formData.append(
        "source",
        "Zahra's Little World — 200 Compliment Generator"
    );


    try{

        const response =
            await fetch(
                FORMSPREE_URL,
                {
                    method:"POST",

                    body:formData,

                    headers:{
                        "Accept":
                        "application/json"
                    }
                }
            );


        if(response.ok){

            button.textContent =
                "SENT SUCCESSFULLY 💗";

            button.style.background =
                "linear-gradient(90deg,#42d392,#36a9e1)";


            alert(
                "Reply successfully send ho gaya 💌🥹\n\n" +
                "Aur tumhare Formspree mein poora generated compliment bhi save ho gaya hai."
            );

        }

        else{

            throw new Error(
                "Formspree rejected request"
            );

        }

    }

    catch(error){

        console.error(error);

        alert(
            "Oops 😭 Reply send nahi hua. Internet ya Formspree endpoint check karo."
        );

        button.disabled =
            false;

        button.textContent =
            "💌 SEND MY REPLY";
    }
}
